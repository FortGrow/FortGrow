<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FortGrow — Pit de Vendas — Slide 2</title>
<link rel="stylesheet" href="../carrossel-alcance-x-faturamento/styles.css">
<style>
  .content { position: absolute; inset: 0; padding: 172px 84px 100px; z-index: 20; }
  .content .h1 { font-size: 90px; }
  .lead { margin-top: 38px; max-width: 840px; font-size: 30px; }

  .checklist {
    margin-top: 38px;
    padding: 36px 52px;
    max-width: 780px;
  }
  .checklist .check-item { padding: 15px 0; border-bottom: 1px solid var(--hairline); font-size: 28px; }
  .checklist .check-item:first-child { padding-top: 0; }
  .checklist .check-item:last-child { border-bottom: none; padding-bottom: 0; }
  .checklist .check-item small {
    display: block;
    font-size: 22px;
    font-weight: 500;
    color: var(--muted-2);
    margin-top: 2px;
  }

  .bottom-card {
    position: absolute;
    left: 84px;
    right: 84px;
    bottom: 78px;
  }
  .bottom-card.alert-bar { padding: 28px 44px; }
  .bottom-card .txt { font-size: 29px; }
</style>
</head>
<body>
<div class="slide">
  <img class="bg-watermark" src="../carrossel-alcance-x-faturamento/assets/fg-mark.png" alt="">
  <img class="bg-tactics" src="../carrossel-alcance-x-faturamento/assets/tactics.svg" alt="">
  <div class="bg-grid-light"></div>
  <div class="flare a"></div>
  <div class="flare c"></div>

  <div class="topbar">
    <div></div>
    <div class="badge"><img src="../carrossel-alcance-x-faturamento/assets/fg-mark.png" alt=""></div>
  </div>

  <div class="content">
    <div class="h1">
      TUDO ISSO,<br>
      <span class="chip">NOS DOIS</span><br>
      FORMATOS.
    </div>
    <div class="brush"></div>

    <div class="lead body-lg">
      Independente do formato escolhido, a entrega é <span class="strong">completa</span>:
    </div>

    <div class="checklist card">
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>Planejamento estratégico.</div>
      </div>
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>CRM.</div>
      </div>
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>Roteiros.</div>
      </div>
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>Consultoria estratégica.</div>
      </div>
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>Gestão de tráfego.</div>
      </div>
      <div class="check-item">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" fill="rgba(35,114,245,0.16)"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>
        </svg>
        <div>Grupo de suporte.</div>
      </div>
    </div>
  </div>

  <div class="bottom-card card alert-bar">
    <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="#3b82f8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
    </svg>
    <div class="divider"></div>
    <div class="txt">
      O que muda é o <span class="blue">formato do investimento</span> —
      <span class="strong">nunca a entrega</span>.
    </div>
  </div>
</div>
</body>
</html>
