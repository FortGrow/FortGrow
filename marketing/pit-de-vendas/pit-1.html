<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FortGrow — Pit de Vendas — Slide 1</title>
<link rel="stylesheet" href="../carrossel-alcance-x-faturamento/styles.css">
<style>
  .content {
    position: absolute;
    inset: 0;
    padding: 300px 84px 110px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .kicker-top {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--blue-soft);
    margin-bottom: 46px;
  }
  .content .h1 { font-size: 128px; }
  .rule { width: 150px; height: 4px; background: var(--blue-bright); margin: 60px auto 52px; }
  .sub {
    font-size: 35px;
    line-height: 1.55;
    font-weight: 500;
    color: var(--muted);
    max-width: 820px;
  }
  .sub .blue { color: var(--blue-bright); font-weight: 700; }
  .sub .strong { color: var(--ink); font-weight: 700; }

  .formats {
    margin-top: auto;
    display: flex;
    gap: 30px;
  }
  .fmt {
    padding: 26px 50px;
    border-radius: 14px;
    font-family: "Anton", sans-serif;
    font-size: 40px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .fmt.a { background: rgba(232, 238, 248, 0.94); color: #0d1524; }
  .fmt.b { background: var(--blue); color: #fff; box-shadow: 0 18px 50px rgba(35, 114, 245, 0.5); }
</style>
</head>
<body>
<div class="slide">
  <img class="bg-watermark" src="../carrossel-alcance-x-faturamento/assets/fg-mark.png" alt="">
  <img class="bg-stadium" src="../carrossel-alcance-x-faturamento/assets/stadium.svg" alt="">
  <div class="bg-grid-light"></div>

  <div class="topbar">
    <div class="wordmark">
      <img src="../carrossel-alcance-x-faturamento/assets/fg-mark.png" alt="">
      <span><b>FORT</b><i>GROW</i></span>
    </div>
    <div class="badge"><img src="../carrossel-alcance-x-faturamento/assets/fg-mark.png" alt=""></div>
  </div>

  <div class="content">
    <div class="kicker-top">Proposta Comercial</div>
    <div class="h1">
      ESTRUTURAÇÃO<br><span class="chip">FORTGROW.</span>
    </div>
    <div class="rule"></div>
    <div class="sub">
      Dois formatos de investimento. <span class="strong">A mesma entrega completa.</span><br>
      Escolha o modelo que faz sentido para o <span class="blue">seu momento</span>.
    </div>

    <div class="formats">
      <div class="fmt a">Fixo</div>
      <div class="fmt b">Variável</div>
    </div>
  </div>
</div>
</body>
</html>
